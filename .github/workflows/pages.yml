name: Publicar no GitHub Pages

# Builda e publica em https://<usuario>.github.io/<repo>/ a cada push nesta
# branch. O passo "configure-pages" com enablement:true habilita o Pages
# sozinho via API na primeira execução — não depende do clique manual em
# Settings → Pages, que às vezes não é aplicado a tempo num repositório novo.
on:
  push:
    branches:
      - claude/pokemon-style-game-design-skz67b
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # enablement:true (abaixo) chama a API que habilita o Pages, e essa chamada
  # exige permissão de administração do repositório — sem ela o passo falha
  # com 403 em vez do 404 anterior
  administration: write

# evita duas publicações rodando ao mesmo tempo; a mais nova cancela a antiga
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
